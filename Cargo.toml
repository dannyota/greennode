[package]
name = "greennode"
version = "0.1.0"
description = "Unofficial AWS-style command-line tool for GreenNode, formerly VNG Cloud"
edition = "2024"
authors = ["Danny"]
license = "Apache-2.0"
repository = "https://github.com/dannyota/greennode"
readme = "README.md"
keywords = ["greennode", "vngcloud", "cloud", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
