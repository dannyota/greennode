name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and manifests
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I scripts/check-crate-release.py manifest --release --tag "$TAG"
      - name: Install pinned Rust
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Read tool pins
        run: |
          echo "CARGO_DENY=$(awk '$1 == "cargo-deny" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
          echo "CARGO_NEXTEST=$(awk '$1 == "cargo-nextest" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@${{ env.CARGO_DENY }}
          fallback: none
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST }}
          fallback: none
      - run: cargo deny --locked check
      - run: cargo nextest run --workspace --locked

  build:
    needs: checks
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            archive: tar.gz
            ext: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            archive: tar.gz
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            archive: tar.gz
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            archive: zip
            ext: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      ARCHIVE: ${{ matrix.archive }}
      EXT: ${{ matrix.ext }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --target "$TARGET"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Build and verify
        shell: bash
        run: |
          cargo build --locked --release --package greennode --target "$TARGET"
          test "$("target/$TARGET/release/greennode$EXT" --version)" = "greennode ${TAG#v} ${PLATFORM/-//}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/licenses binary
          cp "target/$TARGET/release/greennode$EXT" "dist/greennode$EXT"
          cp "dist/greennode$EXT" "binary/greennode$EXT"
          cp LICENSE dist/LICENSE
          cp crates/greennode/licenses/go-jmespath-LICENSE dist/licenses/go-jmespath-LICENSE
          archive="greennode-$PLATFORM.$ARCHIVE"
          if [ "$ARCHIVE" = zip ]; then
            (cd dist && 7z a "../$archive" "greennode$EXT" LICENSE licenses/go-jmespath-LICENSE)
          else
            tar -C dist -czf "$archive" "greennode$EXT" LICENSE licenses/go-jmespath-LICENSE
          fi
          python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); pathlib.Path(sys.argv[2]).write_text(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n", encoding="ascii")' "$archive" "greennode-$PLATFORM.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            greennode-${{ matrix.platform }}.${{ matrix.archive }}
            greennode-${{ matrix.platform }}.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-binary
          path: binary/greennode${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 90

  inventory:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Check shipped commands
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cargo build --locked --release --package greennode
          target/release/greennode __command-inventory > "$RUNNER_TEMP/candidate.json"
          gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv' > "$RUNNER_TEMP/releases"
          previous="$(sort -r "$RUNNER_TEMP/releases" | cut -f 2 | head -n 1)"
          committed=crates/greennode/tests/parity/shipped-commands.json
          if [ -n "$previous" ]; then
            git show "refs/tags/$previous:$committed" > "$RUNNER_TEMP/previous.json"
            python3 -I scripts/check-crate-release.py shipped "$RUNNER_TEMP/candidate.json" "$committed" "$RUNNER_TEMP/previous.json"
          else
            python3 -I scripts/check-crate-release.py shipped "$RUNNER_TEMP/candidate.json" "$committed" --first
          fi

  receipt:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          test "$(rustc --version | cut -d ' ' -f 2)" = "$version"
      - name: Package workspace and create receipt
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          root="$(mktemp -d)"
          stage="$(mktemp -d)"
          test -z "$(git ls-files --stage | grep '^120000 ' || true)"
          test ! -e .cargo/config && test ! -e .cargo/config.toml
          export CARGO_HOME="$root/cargo" CARGO_TARGET_DIR="$root/target" CARGO_BUILD_BUILD_DIR="$root/build"
          cargo package --list --locked --registry crates-io -p greennode-sdk
          cargo package --list --locked --registry crates-io -p greennode
          cargo publish --workspace --dry-run --locked --registry crates-io
          python3 -I - "$root/build/package/tmp-crate" "$stage" "$TAG" <<'PYTHON'
          import pathlib, shutil, sys
          source, stage, tag = map(pathlib.Path, sys.argv[1:])
          version = str(tag)[1:]
          expected = {f'{name}-{version}.crate' for name in ('greennode-sdk', 'greennode')}
          entries = list(source.iterdir())
          assert {p.name for p in entries if p.name.endswith('.crate')} == expected
          for name in expected:
              path = source / name
              assert path.is_file() and not path.is_symlink()
              shutil.copyfile(path, stage / name)
          PYTHON
          version="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          python3 -I scripts/check-crate-release.py receipt "$TAG" "$stage" crate-checksums.json --commit "$COMMIT" --toolchain "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-checksums
          path: crate-checksums.json
          if-no-files-found: error
          retention-days: 90

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-amd64
      - shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Expand-Archive greennode-windows-amd64.zip -DestinationPath extracted
          $actual = & .\extracted\greennode.exe --version
          if ($actual -ne "greennode $($env:TAG.Substring(1)) windows/amd64") { exit 1 }

  release:
    needs: [build, inventory, receipt, smoke-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Verify archive contents
        run: |
          mkdir assets
          python3 -I - <<'PYTHON'
          import hashlib, pathlib, shutil, tarfile, zipfile
          root = pathlib.Path('artifacts')
          license_files = {'LICENSE': pathlib.Path('LICENSE').read_bytes(), 'licenses/go-jmespath-LICENSE': pathlib.Path('crates/greennode/licenses/go-jmespath-LICENSE').read_bytes()}
          for platform, ext in [('darwin-arm64', 'tar.gz'), ('linux-amd64', 'tar.gz'), ('linux-arm64', 'tar.gz'), ('windows-amd64', 'zip')]:
              directory = root / platform
              binary = 'greennode.exe' if ext == 'zip' else 'greennode'
              archive = directory / f'greennode-{platform}.{ext}'
              expected = {**license_files, binary: (root / f'{platform}-binary' / binary).read_bytes()}
              if ext == 'zip':
                  with zipfile.ZipFile(archive) as data:
                      assert sorted(data.namelist()) == sorted(expected)
                      assert all(data.read(name) == value for name, value in expected.items())
              else:
                  with tarfile.open(archive, 'r:gz') as data:
                      members = data.getmembers()
                      assert sorted(member.name for member in members) == sorted(expected)
                      assert all(member.isfile() and data.extractfile(member).read() == expected[member.name] for member in members)
              checksum = directory / f'greennode-{platform}.sha256'
              assert checksum.read_text().strip() == f'{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}'
              shutil.copyfile(archive, pathlib.Path('assets') / archive.name)
              shutil.copyfile(checksum, pathlib.Path('assets') / checksum.name)
          shutil.copyfile(root / 'crate-checksums' / 'crate-checksums.json', 'assets/crate-checksums.json')
          PYTHON
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body_path: notes.md
          fail_on_unmatched_files: true
          files: assets/*
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
