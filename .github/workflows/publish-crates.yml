name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      publish:
        description: Publish crates
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      toolchain: ${{ steps.verify.outputs.toolchain }}
      release_run: ${{ steps.verify.outputs.release_run }}
      receipt_sha256: ${{ steps.verify.outputs.receipt_sha256 }}
      sdk_sha256: ${{ steps.verify.outputs.sdk_sha256 }}
      tool_sha256: ${{ steps.verify.outputs.tool_sha256 }}
    steps:
      - name: Guard dispatch
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$REPOSITORY" = dannyota/greennode
          test "$REF" = refs/heads/master
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ "$PUBLISH" = true ]; then test "$ATTEMPT" = 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/evidence"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" "$DISPATCH_SHA"
          printf '%s\n' "$commit" > "$RUNNER_TEMP/evidence/commit"
          git ls-tree -r -z --full-tree "$commit" > "$RUNNER_TEMP/evidence/tree"
      - name: Gather release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set +x
          unset GH_DEBUG
          evidence="$RUNNER_TEMP/evidence"
          commit=$(< "$evidence/commit")
          gh release view "$TAG" --repo dannyota/greennode --json tagName,isDraft,publishedAt,isImmutable,assets > "$evidence/release.json"
          gh api --paginate --slurp "repos/dannyota/greennode/actions/workflows/release.yml/runs?event=push&head_sha=$commit" |
            jq --arg tag "$TAG" '[.[].workflow_runs[] | select(.head_branch == $tag) | {databaseId: .id, headBranch: .head_branch, headSha: .head_sha, path, conclusion, event}]' > "$evidence/runs.json"
          run=$(jq -er 'if length == 1 then .[0].databaseId else error("runs") end' "$evidence/runs.json")
          for name in darwin-arm64 linux-amd64 linux-arm64 windows-amd64 crate-checksums; do
            gh run download "$run" --repo dannyota/greennode --name "$name" --dir "$evidence/artifacts/$name"
          done
      - name: Gather owners
        shell: bash
        run: |
          umask 077
          evidence="$RUNNER_TEMP/evidence"
          for pair in greennode-sdk:sdk greennode:tool; do
            crate=${pair%%:*}
            out="$evidence/${pair##*:}-owners.json"
            code=$(curl -sS --max-time 30 --max-filesize 1048576 -A greennode-release -o "$out.body" -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/owners")
            case "$code" in
              200) jq -e '.users | type == "array"' "$out.body" > /dev/null; mv "$out.body" "$out" ;;
              404) python3 -I - "$out.body" "$crate" <<'PYTHON'
          import json, sys
          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError('duplicate key')
                  result[key] = value
              return result
          with open(sys.argv[1], encoding='utf-8') as stream:
              data = json.load(stream, object_pairs_hook=pairs)
          if data != {'errors': [{'detail': f'crate `{sys.argv[2]}` does not exist'}]}:
              raise ValueError('unexpected not-found body')
          PYTHON
                   printf 'null\n' > "$out" ;;
              *) exit 1 ;;
            esac
          done
      - name: Verify evidence and registry
        id: verify
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          evidence="$RUNNER_TEMP/evidence"
          commit=$(< "$evidence/commit")
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 -I scripts/check-crate-release.py evidence "$TAG" "$commit" "$evidence/release.json" "$evidence/runs.json" "$evidence/sdk-owners.json" "$evidence/tool-owners.json" "$evidence/artifacts" "$evidence/tree" "${args[@]}"
          mkdir -p "$evidence/manifests/crates/greennode-sdk" "$evidence/manifests/crates/greennode"
          for file in Cargo.toml crates/greennode-sdk/Cargo.toml crates/greennode/Cargo.toml; do
            git show "$commit:$file" > "$evidence/manifests/$file"
          done
          (cd "$evidence/manifests" && python3 -I "$GITHUB_WORKSPACE/scripts/check-crate-release.py" manifest --tag "$TAG" --release)
          receipt="$evidence/artifacts/crate-checksums/crate-checksums.json"
          states=$(python3 -I scripts/check-crate-release.py state "$receipt")
          toolchain=$(jq -er '.toolchain' "$receipt")
          run=$(jq -er '.[0].databaseId' "$evidence/runs.json")
          digest=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          sdk_sha256=$(jq -er '.crates[] | select(.name == "greennode-sdk") | .sha256' "$receipt")
          tool_sha256=$(jq -er '.crates[] | select(.name == "greennode") | .sha256' "$receipt")
          printf 'tag=%s\ncommit=%s\ntoolchain=%s\nrelease_run=%s\nreceipt_sha256=%s\nsdk_sha256=%s\ntool_sha256=%s\n' "$TAG" "$commit" "$toolchain" "$run" "$digest" "$sdk_sha256" "$tool_sha256" >> "$GITHUB_OUTPUT"
          {
            printf '## Release preflight\n\nReceipt SHA-256: %s\n\n' "$digest"
            jq -r '.crates[] | "- \(.name): \(.sha256)"' "$receipt"
            printf '\n%s\n' "$states"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare tagged checkout
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
        run: |
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tagged"
          git -C "$RUNNER_TEMP/tagged" checkout --detach "refs/tags/$TAG"
          test "$(git -C "$RUNNER_TEMP/tagged" rev-parse HEAD)" = "$COMMIT"
          version=$(tr -d '\r' < "$RUNNER_TEMP/tagged/rust-toolchain.toml" | sed -n 's/^channel = "\(.*\)"$/\1/p')
          test "$version" = "$TOOLCHAIN"
          test "$version" = 1.100.0
          rustup toolchain install "$version" --profile minimal
          test "$(rustc +"$version" --version | cut -d ' ' -f 2)" = "$version"
      - name: Package workspace and compare
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
          SDK_SHA256: ${{ needs.verify.outputs.sdk_sha256 }}
          TOOL_SHA256: ${{ needs.verify.outputs.tool_sha256 }}
        run: |
          cd "$RUNNER_TEMP/tagged"
          root=$(mktemp -d)
          stage="$root/staged-crates"
          mkdir "$stage"
          git ls-files --stage -z > "$root/index"
          python3 -I - "$root/index" <<'PYTHON'
          import pathlib, sys, tomllib
          entries = pathlib.Path(sys.argv[1]).read_bytes().split(b'\0')
          required = {b'README.md', b'LICENSE', b'crates/greennode-sdk/README.md'}
          found = set()
          for entry in filter(None, entries):
              header, path = entry.split(b'\t', 1)
              mode, _, stage = header.split(b' ')
              if mode == b'120000':
                  raise ValueError('tracked symlink')
              if path in required:
                  file = pathlib.Path(path.decode())
                  if mode not in (b'100644', b'100755') or stage != b'0' or file.is_symlink() or not file.is_file():
                      raise ValueError('invalid tracked release input')
                  found.add(path)
          if found != required:
              raise ValueError('missing tracked release input')
          for name, readme in (('greennode-sdk', 'README.md'), ('greennode', '../../README.md')):
              with open(pathlib.Path('crates') / name / 'Cargo.toml', 'rb') as stream:
                  if tomllib.load(stream)['package'].get('readme') != readme:
                      raise ValueError('unexpected package readme')
          PYTHON
          if [ -e .cargo/config ] || [ -L .cargo/config ] || [ -e .cargo/config.toml ] || [ -L .cargo/config.toml ]; then
            exit 1
          fi
          export CARGO_HOME="$root/cargo" CARGO_TARGET_DIR="$root/target" CARGO_BUILD_BUILD_DIR="$root/build"
          cargo +"$TOOLCHAIN" package --list --locked --registry crates-io -p greennode-sdk > "$root/sdk-list"
          cargo +"$TOOLCHAIN" package --list --locked --registry crates-io -p greennode > "$root/tool-list"
          for list in "$root/sdk-list" "$root/tool-list"; do
            grep -Fx 'README.md' "$list"
            grep -Fx 'LICENSE' "$list"
          done
          cargo +"$TOOLCHAIN" publish --workspace --dry-run --no-verify --locked --registry crates-io
          python3 -I - "$root/build/package/tmp-crate" "$stage" "$TAG" <<'PYTHON'
          import pathlib, shutil, sys
          source, stage, tag = map(pathlib.Path, sys.argv[1:])
          version = str(tag)[1:]
          expected = {f'{name}-{version}.crate' for name in ('greennode-sdk', 'greennode')}
          entries = list(source.iterdir())
          assert {p.name for p in entries if p.name.endswith('.crate')} == expected
          for name in expected:
              path = source / name
              assert path.is_file() and not path.is_symlink()
              shutil.copyfile(path, stage / name)
          PYTHON
          test "$(sha256sum "$stage/greennode-sdk-${TAG#v}.crate" | cut -d ' ' -f 1)" = "$SDK_SHA256"
          test "$(sha256sum "$stage/greennode-${TAG#v}.crate" | cut -d ' ' -f 1)" = "$TOOL_SHA256"

  publish:
    needs: [verify, package]
    if: ${{ inputs.publish && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify owner approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = dannyota/greennode
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_REF_PROTECTED" = true
          environment_id=$(gh api "repos/$GITHUB_REPOSITORY/environments/crates-io" | jq -esr '
            select(length == 1) | .[0] | objects
            | select(.name == "crates-io" and any(
              .protection_rules | arrays | .[] | objects | select(.type == "required_reviewers")
              | .reviewers | arrays | .[] | objects;
              .type == "User" and .reviewer.login == "dannyota"
            )) | .id | numbers
          ')
          [[ "$environment_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -es --argjson id "$environment_id" '
              select(length == 1) | .[0] | arrays | any(.[] | objects;
              .state == "approved" and .user.login == "dannyota" and
              any(.environments | arrays | .[] | objects; .id == $id and .name == "crates-io")
            )' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck release evidence
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
          RELEASE_RUN: ${{ needs.verify.outputs.release_run }}
          RECEIPT_SHA256: ${{ needs.verify.outputs.receipt_sha256 }}
        run: |
          set +x
          unset GH_DEBUG
          umask 077
          evidence="$RUNNER_TEMP/publish-evidence"
          mkdir -p "$evidence"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA"
          git ls-tree -r -z --full-tree "$COMMIT" > "$evidence/tree"
          gh release view "$TAG" --repo dannyota/greennode --json tagName,isDraft,publishedAt,isImmutable,assets > "$evidence/release.json"
          gh api --paginate --slurp "repos/dannyota/greennode/actions/workflows/release.yml/runs?event=push&head_sha=$COMMIT" |
            jq --arg tag "$TAG" '[.[].workflow_runs[] | select(.head_branch == $tag) | {databaseId: .id, headBranch: .head_branch, headSha: .head_sha, path, conclusion, event}]' > "$evidence/runs.json"
          test "$(jq -er 'if length == 1 then .[0].databaseId else error("runs") end' "$evidence/runs.json")" = "$RELEASE_RUN"
          for name in darwin-arm64 linux-amd64 linux-arm64 windows-amd64 crate-checksums; do
            gh run download "$RELEASE_RUN" --repo dannyota/greennode --name "$name" --dir "$evidence/artifacts/$name"
          done
          for pair in greennode-sdk:sdk greennode:tool; do
            crate=${pair%%:*}
            curl -fsS --max-time 30 --max-filesize 1048576 -A greennode-release "https://crates.io/api/v1/crates/$crate/owners" > "$evidence/${pair##*:}-owners.json"
          done
          python3 -I scripts/check-crate-release.py evidence "$TAG" "$COMMIT" "$evidence/release.json" "$evidence/runs.json" "$evidence/sdk-owners.json" "$evidence/tool-owners.json" "$evidence/artifacts" "$evidence/tree" --publish
          receipt="$evidence/artifacts/crate-checksums/crate-checksums.json"
          mkdir "$evidence/release"
          gh release download "$TAG" --repo dannyota/greennode --pattern crate-checksums.json --dir "$evidence/release"
          cmp "$receipt" "$evidence/release/crate-checksums.json"
          test "$(sha256sum "$receipt" | cut -d ' ' -f 1)" = "$RECEIPT_SHA256"
          test "$(jq -er '.toolchain' "$receipt")" = "$TOOLCHAIN"
          test "$TOOLCHAIN" = 1.100.0
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/publish-tagged"
          git -C "$RUNNER_TEMP/publish-tagged" checkout --detach "refs/tags/$TAG"
          test "$(git -C "$RUNNER_TEMP/publish-tagged" rev-parse HEAD)" = "$COMMIT"
          test ! -L "$RUNNER_TEMP/publish-tagged/.cargo"
          test ! -e "$RUNNER_TEMP/publish-tagged/.cargo/config"
          test ! -e "$RUNNER_TEMP/publish-tagged/.cargo/config.toml"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          mkdir "$RUNNER_TEMP/publish-cargo"
          states=$(python3 -I scripts/check-crate-release.py state "$receipt")
          printf '%s\n' "$states" >> "$GITHUB_STEP_SUMMARY"
          if [ "$states" = $'greennode-sdk: present-and-approved\ngreennode: present-and-approved' ]; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Exchange OIDC for a crates.io token
        if: ${{ steps.prepare.outputs.needed == 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Check SDK registry state
        if: ${{ steps.prepare.outputs.needed == 'true' }}
        id: sdk_state
        shell: bash
        run: |
          receipt="$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json"
          states=$(python3 -I scripts/check-crate-release.py state "$receipt")
          case "$states" in
            $'greennode-sdk: absent\ngreennode: absent'|$'greennode-sdk: absent\ngreennode: present-and-approved') printf 'needed=true\n' >> "$GITHUB_OUTPUT" ;;
            $'greennode-sdk: present-and-approved\ngreennode: absent'|$'greennode-sdk: present-and-approved\ngreennode: present-and-approved') printf 'needed=false\n' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Upload SDK
        if: ${{ steps.sdk_state.outputs.needed == 'true' }}
        id: sdk_upload
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
          SDK_SHA256: ${{ needs.verify.outputs.sdk_sha256 }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set +x
          printf 'greennode-sdk: unknown version=%s sha256=%s until confirmed\n' "${TAG#v}" "$SDK_SHA256" >> "$GITHUB_STEP_SUMMARY"
          export CARGO_HOME="$RUNNER_TEMP/publish-cargo"
          export GREENNODE_RELEASE_RECEIPT="$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json"
          cd "$RUNNER_TEMP/publish-tagged"
          cargo +"$TOOLCHAIN" publish --no-verify --locked --registry crates-io --package greennode-sdk --config "$GITHUB_WORKSPACE/scripts/publish-cargo.toml" --config net.retry=0
      - name: Confirm SDK upload
        if: ${{ always() && steps.sdk_state.outputs.needed == 'true' && !cancelled() }}
        shell: bash
        run: |
          python3 -I scripts/check-crate-release.py state "$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json" --wait greennode-sdk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check tool registry state
        if: ${{ success() && steps.prepare.outputs.needed == 'true' && (steps.sdk_state.outputs.needed == 'false' || steps.sdk_upload.outcome == 'success') }}
        id: tool_state
        shell: bash
        run: |
          curl -fsS --max-time 30 --max-filesize 1048576 -A greennode-release https://crates.io/api/v1/crates/greennode-sdk/owners | jq -e '.users | any(.kind == "user" and .login == "dannyota")' > /dev/null
          states=$(python3 -I scripts/check-crate-release.py state "$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json")
          case "$states" in
            $'greennode-sdk: present-and-approved\ngreennode: absent') printf 'needed=true\n' >> "$GITHUB_OUTPUT" ;;
            $'greennode-sdk: present-and-approved\ngreennode: present-and-approved') printf 'needed=false\n' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Upload tool
        if: ${{ steps.tool_state.outputs.needed == 'true' }}
        id: tool_upload
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          TOOLCHAIN: ${{ needs.verify.outputs.toolchain }}
          TOOL_SHA256: ${{ needs.verify.outputs.tool_sha256 }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set +x
          printf 'greennode: unknown version=%s sha256=%s until confirmed\n' "${TAG#v}" "$TOOL_SHA256" >> "$GITHUB_STEP_SUMMARY"
          export CARGO_HOME="$RUNNER_TEMP/publish-cargo"
          export GREENNODE_RELEASE_RECEIPT="$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json"
          cd "$RUNNER_TEMP/publish-tagged"
          cargo +"$TOOLCHAIN" publish --no-verify --locked --registry crates-io --package greennode --config "$GITHUB_WORKSPACE/scripts/publish-cargo.toml" --config net.retry=0
      - name: Confirm tool upload
        if: ${{ always() && steps.tool_state.outputs.needed == 'true' && !cancelled() }}
        shell: bash
        run: |
          python3 -I scripts/check-crate-release.py state "$RUNNER_TEMP/publish-evidence/artifacts/crate-checksums/crate-checksums.json" --wait greennode | tee -a "$GITHUB_STEP_SUMMARY"
