[package]
name = "greennode-sdk"
version.workspace = true
description = "Unofficial Rust SDK for the GreenNode API"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["greennode", "vngcloud", "cloud", "api", "sdk"]
categories = ["api-bindings"]

[dependencies]
bytes = "1.12.2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1.0.12"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.11.1"
time = "0.3.55"
tower-service = "0.3.3"
zeroize = "1.9.2"
url = "2.5.9"
tokio = { version = "1.54", features = ["time", "sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["time", "sync", "rt", "macros", "test-util", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
