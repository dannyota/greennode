[package]
name = "greennode-sdk"
version.workspace = true
description = "Unofficial Rust SDK for the GreenNode API"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["greennode", "vngcloud", "cloud", "api", "sdk"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
zeroize = "1.9.2"
url = "2.5.9"
tokio = { version = "1.54", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["time", "sync", "rt", "macros", "test-util"] }
serde_json = "1.0.154"
