[package]
name = "greennode"
version.workspace = true
description = "Unofficial AWS-style command-line tool for GreenNode, formerly VNG Cloud"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["greennode", "vngcloud", "cloud", "cli"]
categories = ["command-line-utilities"]
exclude = ["tests/"]

[dependencies]
greennode-sdk = { path = "../greennode-sdk", version = "=0.1.0" }
tokio = { version = "1.54", features = ["rt", "signal", "time"] }
clap = { version = "4.6", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.154"
ryu = "1.0.23"

[dev-dependencies]
greennode-sdk = { path = "../greennode-sdk", version = "=0.1.0", features = ["test-support"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
