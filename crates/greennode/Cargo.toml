[package]
name = "greennode"
version.workspace = true
description = "Unofficial AWS-style command-line tool for GreenNode, formerly VNG Cloud"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["greennode", "vngcloud", "cloud", "cli"]
categories = ["command-line-utilities"]
exclude = ["tests/"]

[dependencies]
greennode-sdk = { path = "../greennode-sdk", version = "=0.1.0" }
tokio = { version = "1.54", features = ["rt-multi-thread", "signal", "time"] }
clap = { version = "4.6", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.154"
ryu = "1.0.23"
getrandom = "0.4.3"
same-file = "1.0.6"
zeroize = "1.9.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
greennode-sdk = { path = "../greennode-sdk", version = "=0.1.0", features = ["test-support"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
